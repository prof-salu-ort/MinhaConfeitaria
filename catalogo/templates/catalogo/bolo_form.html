{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Novo Bolo</title>
    <link rel="stylesheet" href="{% static 'catalogo/style.css' %}">
</head>
<body>
    <h1>{% if form.instance.pk %}Editar Bolo{% else %}Adicionar Novo Bolo{% endif %}</h1>

    <!-- Adicionado o enctype obrigatório! -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn">Salvar</button>
        <a href="{% url 'catalogo:lista_bolos' %}" class="btn">Cancelar</a>
    </form>
</body>
</html>
